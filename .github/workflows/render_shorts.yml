name: render_shorts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-build:
    name: Core build + bot smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show compiler
        run: |
          g++ --version || clang++ --version || c++ --version || true

      - name: Build core
        run: |
          python3 tools/build.py all

      - name: Verify source/body id
        run: |
          python3 tools/build.py verify

      - name: CLI source id smoke
        run: |
          ./build/saem_cli --source-id

      - name: Core method smoke
        run: |
          echo '{"id":1,"method":"gen.topics","args":{}}' | ./build/saem_cli | grep '"ok":true'
          echo '{"id":2,"method":"core.methods","args":{}}' | ./build/saem_cli | grep '"ok":true'
          echo '{"id":3,"method":"qcos.boot","args":{}}' | ./build/saem_cli | grep '"ok":true'

      - name: Python syntax checks
        run: |
          python3 -m py_compile batch_runner.py
          python3 -m py_compile render_universal.py
          python3 -m py_compile generate_audio.py
          python3 -m py_compile schema_validator.py

      - name: Validate example CSV if present
        run: |
          if [ -f examples/feynman_speed_demo.csv ]; then
            python3 schema_validator.py examples/feynman_speed_demo.csv
          else
            echo "No example CSV found; skipping schema validation."
          fi

      - name: Upload core binary
        uses: actions/upload-artifact@v4
        with:
          name: saem_cli-linux
          path: build/saem_cli

  factory-lint:
    name: Video factory lint
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lightweight factory checks
        run: |
          python3 -m py_compile batch_runner.py
          python3 -m py_compile render_universal.py
          python3 -m py_compile generate_audio.py
          python3 -m py_compile schema_validator.py
