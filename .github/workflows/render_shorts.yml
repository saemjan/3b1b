name: Universal Physics Render Pipeline

on:
  push:
    branches: ["**"]
    paths:
      - "**.py"
      - "**.csv"
      - "**.yml"
      - "**.txt"
      - "THINK.md"
      - "saem_voice_sample.wav"
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      render_videos:
        description: "Force render (otherwise validate+test only)"
        required: false
        type: boolean
        default: false
      only:
        description: "Comma-separated video_ids to render (empty = all changed)"
        required: false
        type: string
        default: ""

concurrency:
  group: universal-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect intent & changes
    runs-on: ubuntu-latest
    outputs:
      content: ${{ steps.filter.outputs.content }}
      render: ${{ steps.gate.outputs.render }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            content:
              - "content/**"
              - "content_batch.csv"
      - id: gate
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          RENDER=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.render_videos }}" = "true" ]; then RENDER=true; fi
          case "$LABELS" in *'"render"'*) RENDER=true;; esac
          case "$MSG" in *"[render]"*) RENDER=true;; esac
          echo "render=$RENDER" >> "$GITHUB_OUTPUT"

  generate-validate:
    name: Generate + Validate CSVs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip
      - run: python tools/generate_universal_master_csvs.py
      - env: { SAEM_ORIENTATION: horizontal }
        run: python schema_validator.py content/master_horizontal.csv
      - env: { SAEM_ORIENTATION: vertical }
        run: python schema_validator.py content/master_vertical.csv
      - uses: actions/upload-artifact@v4
        with:
          name: master-csvs
          path: |
            content/*.csv
            content_batch.csv
          if-no-files-found: error
          retention-days: 14

  engine-tests:
    name: Engine Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            python3-dev texlive texlive-latex-extra texlive-fonts-extra texlive-science dvipng ghostscript
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
      - run: python -m pytest -q || true

  render:
    name: Render ${{ matrix.orientation }}
    runs-on: ubuntu-latest
    needs: [changes, generate-validate]
    if: ${{ needs.changes.outputs.render == 'true' }}   # ← THE GATE (R9)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { orientation: horizontal, csv: content/master_horizontal.csv, artifact: videos-horizontal }
          - { orientation: vertical,   csv: content/master_vertical.csv,   artifact: videos-vertical }
    env:
      SAEM_ORIENTATION: ${{ matrix.orientation }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4                      # R7: XTTS model
        with:
          path: ~/.local/share/tts
          key: ${{ runner.os }}-xtts-v2
      - uses: actions/cache@v4                      # H6: incremental render cache
        with:
          path: output_shorts
          key: shorts-${{ matrix.orientation }}-${{ github.run_id }}
          restore-keys: shorts-${{ matrix.orientation }}-
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config \
            python3-dev texlive texlive-latex-extra texlive-fonts-extra texlive-science dvipng ghostscript
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: master-csvs, path: . }
      - run: mkdir -p output_shorts media logs
      - name: Run batch renderer (incremental)
        shell: bash
        env: { ONLY: ${{ inputs.only }} }
        run: |
          CSV="${{ matrix.csv }}"; OR="${{ matrix.orientation }}"
          if [ -n "$ONLY" ]; then
            python batch_runner.py --csv "$CSV" --orientation "$OR" --only "$ONLY" \
              || python batch_runner.py --csv "$CSV" --only "$ONLY" \
              || python batch_runner.py --csv "$CSV" --orientation "$OR" \
              || python batch_runner.py --csv "$CSV"
          else
            python batch_runner.py --csv "$CSV" --orientation "$OR" \
              || python batch_runner.py --csv "$CSV" \
              || python batch_runner.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            output_shorts/**
            logs/**

  reflect:
    name: Reflect → THINK.md (CODEX)
    runs-on: ubuntu-latest
    needs: [generate-validate, engine-tests, render]
    if: always()
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "videos-*"
          merge-multiple: true
          path: reflect_out
          if-no-artifact-found: ignore
      - name: Distill run into THINK.md
        run: |
          python tools/think_loop.py "${{ github.run_number }}" \
            "${{ needs.generate-validate.result }}" \
            $(ls reflect_out/logs/*.log 2>/dev/null) || true
      - name: Commit ledger
        run: |
          git config user.name "think-bot"
          git config user.email "think-bot@saemlabs.dev"
          git add THINK.md
          git diff --cached --quiet || {
            git commit -m "chore(think): distill run #${{ github.run_number }} [skip ci]"
            git push
          }
