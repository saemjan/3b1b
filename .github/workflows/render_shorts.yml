name: 🎬 Render Shorts / QCOS Development Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Input method: csv | run (generator cmd) | synthesize"
        required: false
        default: "csv"
        type: choice
        options: [csv, run, synthesize]
      generator_cmd:
        description: "Generator command when mode=run, e.g. python3 tools/generate_feynman_series.py --volume 2"
        required: false
        default: ""
      topics:
        description: "Comma topics when mode=synthesize (kinematics,emwave,twoslit,ratchet,betatron,masers)"
        required: false
        default: "kinematics"
      rows_per_topic:
        description: "Rows per topic when mode=synthesize"
        required: false
        default: "1"
      seed:
        description: "Deterministic seed for synthesis"
        required: false
        default: "7"
      orientation:
        description: "Batch orientation (one batch = one orientation, rule 6)"
        required: false
        default: "vertical"
        type: choice
        options: [vertical, horizontal]
      target_duration:
        description: "Target seconds per synthesized row"
        required: false
        default: "60"
      autofix_duration:
        description: "Retune target_duration_sec to word count (kills Phase 2 warnings)"
        type: boolean
        default: true
      csv:
        description: "CSV path for mode=csv / output of generator_cmd"
        required: false
        default: "content_batch.csv"
      only:
        description: "Optional comma-separated video_id filter"
        required: false
        default: ""
      draft:
        type: boolean
        default: true
      require_oracle:
        type: boolean
        default: false
      require_qa:
        type: boolean
        default: false
      enable_full_render:
        type: boolean
        default: false

concurrency:
  group: render-shorts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-0-bootstrap:
    name: "🧭 Phase 0: Bootstrap, Input Compiler & Manifest"
    runs-on: ubuntu-latest
    outputs:
      csv: ${{ steps.factory.outputs.csv }}
      only: ${{ inputs.only }}
      draft: ${{ inputs.draft }}
      require_oracle: ${{ inputs.require_oracle }}
      require_qa: ${{ inputs.require_qa }}
      enable_full_render: ${{ inputs.enable_full_render }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run factory input compiler
        id: factory
        env:
          FACTORY_MODE: ${{ inputs.mode || 'csv' }}
          FACTORY_GENERATOR_CMD: ${{ inputs.generator_cmd }}
          FACTORY_TOPICS: ${{ inputs.topics }}
          FACTORY_ROWS_PER_TOPIC: ${{ inputs.rows_per_topic }}
          FACTORY_SEED: ${{ inputs.seed }}
          FACTORY_ORIENTATION: ${{ inputs.orientation }}
          FACTORY_TARGET_DURATION: ${{ inputs.target_duration }}
          FACTORY_AUTOFIX_DURATION: ${{ inputs.autofix_duration }}
          FACTORY_CSV: ${{ inputs.csv }}
          FACTORY_OUT: ${{ inputs.csv }}
        run: |
          mkdir -p reports
          python3 tools/factory_input.py
      - name: Upload bootstrap reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-bootstrap-reports
          path: reports/
          if-no-files-found: ignore

  phase-1-compiler:
    name: "🧬 Phase 1: Compiler / C++ Core / Engines"
    runs-on: ubuntu-latest
    needs: phase-0-bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: mkdir -p reports
      - name: Build core
        run: |
          set -o pipefail
          python3 tools/build.py all 2>&1 | tee reports/build.log
      - name: Verify source/body id
        run: |
          set -o pipefail
          python3 tools/build.py verify 2>&1 | tee reports/verify.log
      - name: Core method smoke tests
        run: |
          for m in gen.topics core.methods qcos.boot; do
            echo "{\"id\":1,\"method\":\"$m\",\"args\":{}}" | ./build/saem_cli | grep '"ok":true'
          done
      - name: Engine health & routing parity
        run: |
          set -o pipefail
          python3 tools/engine_check.py --github-summary 2>&1 | tee reports/engine_check.log
      - name: Golden QCOS witness (A5)
        run: |
          set -o pipefail
          python3 tools/golden_qcos.py check 2>&1 | tee reports/golden_qcos.log
      - name: Canon lint (one canon, four tongues)
        run: |
          set -o pipefail
          python3 tools/canon_lint.py 2>&1 | tee reports/canon_lint.log
      - name: Upload compiler/core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-compiler-reports
          path: reports/
          if-no-files-found: ignore
      - name: Upload core binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saem-cli-linux
          path: build/saem_cli

  phase-2-content-gates:
    name: "🧪 Phase 2: Content / Schema / Oracle Gates"
    runs-on: ubuntu-latest
    needs: [phase-0-bootstrap, phase-1-compiler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate the compiled CSV
        env:
          CSV: ${{ needs.phase-0-bootstrap.outputs.csv }}
          REQUIRE_ORACLE: ${{ needs.phase-0-bootstrap.outputs.require_oracle }}
        run: |
          python3 - "$CSV" "$REQUIRE_ORACLE" <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, ".")
          import schema_validator as sv
          csv_path, req = sys.argv[1], sys.argv[2] == "true"
          rows, errs, warns = sv.validate_csv(csv_path, req)
          pathlib.Path("reports").mkdir(exist_ok=True)
          pathlib.Path("reports/schema_summary.json").write_text(
              json.dumps({"csv": csv_path, "rows": len(rows),
                          "errors": errs, "warnings": warns}, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## 🧪 Phase 2\n\n")
              f.write(f"- `{csv_path}`: {len(rows)} rows, {len(errs)} errors, {len(warns)} warnings\n")
              for w in warns: f.write(f"  - ⚠️ {w}\n")
              for e in errs:  f.write(f"  - ❌ {e}\n")
          sys.exit(1 if errs else 0)
          PY
      - name: Upload content gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-content-reports
          path: reports/
          if-no-files-found: ignore

  phase-3-python-factory:
    name: "🐍 Phase 3: Python Factory Static Checks"
    runs-on: ubuntu-latest
    needs: [phase-0-bootstrap, phase-1-compiler]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check factory + engines
        run: |
          python3 -m py_compile batch_runner.py render_universal.py generate_audio.py \
            schema_validator.py core_processor.py make_batch.py saem/qcos_shell.py \
            tools/build.py tools/grow.py tools/ledger.py tools/physics_oracle.py \
            tools/visual_qa.py tools/word_sync.py tools/factory_input.py tools/engine_check.py \
            calculus_engine.py electromagnetics_engine.py fluid_dynamics_engine.py \
            geometry_engine.py linear_algebra_engine.py rotational_motion_engine.py \
            physics_simulation.py sound_design.py soundscape.py text_normalizer.py
          echo "## 🐍 Phase 3" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ 24 factory + engine files syntax OK" >> "$GITHUB_STEP_SUMMARY"

  phase-4-full-render:
    name: "🎬 Phase 4: Full Render (Optional / Heavy)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: needs.phase-0-bootstrap.outputs.enable_full_render == 'true'
    needs: [phase-0-bootstrap, phase-1-compiler, phase-2-content-gates, phase-3-python-factory]
    env:
      CSV: ${{ needs.phase-0-bootstrap.outputs.csv }}
      ONLY: ${{ needs.phase-0-bootstrap.outputs.only }}
      DRAFT: ${{ needs.phase-0-bootstrap.outputs.draft }}
      REQUIRE_ORACLE: ${{ needs.phase-0-bootstrap.outputs.require_oracle }}
      REQUIRE_QA: ${{ needs.phase-0-bootstrap.outputs.require_qa }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System media deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev
      - name: Python deps
        run: |
          python3 -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
      - name: Render batch
        run: |
          CMD="python3 batch_runner.py --csv $CSV --retries 1"
          [ "$DRAFT" = "true" ] && CMD="$CMD --draft"
          [ -n "$ONLY" ] && CMD="$CMD --only $ONLY"
          [ "$REQUIRE_ORACLE" = "true" ] && CMD="$CMD --require-oracle"
          [ "$REQUIRE_QA" = "true" ] && CMD="$CMD --require-qa"
          echo "$CMD" >> "$GITHUB_STEP_SUMMARY"
          $CMD
      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-media
          path: |
            output_shorts/
            logs/
          if-no-files-found: ignore

  phase-5-final-report:
    name: "📊 Phase 5: Final Summary"
    runs-on: ubuntu-latest
    if: always()
    needs: [phase-0-bootstrap, phase-1-compiler, phase-2-content-gates, phase-3-python-factory, phase-4-full-render]
    steps:
      - name: Final table
        run: |
          {
            echo "## 📊 Final Development Phase Summary"
            echo "| Phase | Status |"
            echo "|---|---|"
            echo "| 🧭 Bootstrap + input compiler | ${{ needs.phase-0-bootstrap.result }} |"
            echo "| 🧬 Compiler / core / engines | ${{ needs.phase-1-compiler.result }} |"
            echo "| 🧪 Content gates | ${{ needs.phase-2-content-gates.result }} |"
            echo "| 🐍 Python factory | ${{ needs.phase-3-python-factory.result }} |"
            echo "| 🎬 Full render | ${{ needs.phase-4-full-render.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
