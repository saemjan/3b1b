name: Render Physics Shorts

on:
  push:
    branches: [main]
    paths:
      - "content_batch.csv"
      - "generate_csv.py"
      - "generate_audio.py"
      - "sound_design.py"
      - "tools/generate_topic_bundle.py"
      - "tools/generate_feynman_series.py"
      - "render_universal.py"
      - "batch_runner.py"
      - "schema_validator.py"
      - "requirements.txt"
      - ".github/workflows/render_shorts.yml"
      - "examples/feynman_20_video_batch.csv"
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated video_ids to render (blank = all)"
        required: false
        default: ""
      orientation:
        description: "vertical | horizontal"
        required: false
        default: "horizontal"
      format:
        description: "short | lecture | both"
        required: false
        default: "both"
      concept:
        description: "Optional concept/topic to generate"
        required: false
        default: ""
      problem:
        description: "Optional problem/scenario to include"
        required: false
        default: ""
      quality:
        description: "draft | 720p | 1080p | 4k"
        required: false
        default: "1080p"
      csv_path:
        description: "CSV batch to render"
        type: choice
        options:
          - content_batch.csv
          - examples/feynman_20_video_batch.csv
        required: true
        default: content_batch.csv

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  COQUI_TOS_AGREED: "1"
  SAEM_ORIENTATION: ${{ inputs.orientation || 'horizontal' }}
  HF_HOME: ${{ github.workspace }}/.hf_cache
  BATCH_CSV: ${{ inputs.csv_path || 'content_batch.csv' }}
  VIDEO_IDS: ${{ inputs.only || '' }}
  RENDER_QUALITY: ${{ inputs.quality || '' }}

jobs:
  # ========================================================== validate
  validate:
    runs-on: ubuntu-latest
    outputs:
      row_count: ${{ steps.count.outputs.rows }}
      video_ids: ${{ steps.count.outputs.ids }}
      orientation: ${{ steps.orient.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
     
      - name: Generate content CSV
        env:
          TOPIC_CONCEPT: ${{ inputs.concept }}
          TOPIC_PROBLEM: ${{ inputs.problem }}
          VIDEO_FORMAT: ${{ inputs.format || 'both' }}
        run: |
          if [ -n "$TOPIC_CONCEPT" ] || [ -n "$TOPIC_PROBLEM" ]; then
            if [ -z "$TOPIC_CONCEPT" ] || [ -z "$TOPIC_PROBLEM" ]; then
              echo "::error::Provide both concept and problem, or leave both blank."
              exit 1
            fi
            python3 tools/generate_topic_bundle.py \
              --concept "$TOPIC_CONCEPT" \
              --problem "$TOPIC_PROBLEM" \
              --kind "$VIDEO_FORMAT" \
              --output "$BATCH_CSV"
          elif [ "$BATCH_CSV" = "content_batch.csv" ] && [ -f generate_csv.py ]; then
            python3 generate_csv.py
          fi

      - name: Inspect CSV header and rows
        run: |
          if [ ! -f "$BATCH_CSV" ]; then
            echo "::error::Batch CSV not found: $BATCH_CSV"
            exit 1
          fi
          echo "::group::CSV header"
          head -1 "$BATCH_CSV"
          echo "::endgroup::"

          echo "::group::Row summary"
          python3 - <<'PY'
          import csv, os
          with open(os.environ["BATCH_CSV"], newline="", encoding="utf-8") as f:
              r = csv.reader(f)
              header = next(r)
              rows = list(r)
          print(f"Columns: {len(header)}")
          print(f"Rows:    {len(rows)}")
          for i, row in enumerate(rows, start=2):
              vid = row[0] if row else "<blank>"
              orient = row[13] if len(row) > 13 else "<missing>"
              print(f"  row {i:02d}  {vid:50s}  orientation={orient}")
          PY
          echo "::endgroup::"

      - name: Extract row count and video IDs
        id: count
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, os
          with open(os.environ["BATCH_CSV"], newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          ids = ",".join(r["video_id"] for r in rows)
          print(f"rows={len(rows)}")
          print(f"ids={ids}")
          PY

      - name: Confirm orientation agreement
        id: orient
        run: |
          python3 - <<'PY'
          import csv, os, sys
          rows = list(csv.DictReader(
              open(os.environ["BATCH_CSV"], newline="", encoding="utf-8")))
          if not rows:
              sys.exit("::error::CSV has no data rows")
          csv_orients = {r.get("orientation", "").strip().lower() for r in rows}
          invalid = csv_orients - {"", "vertical", "horizontal"}
          if invalid:
              sys.exit(f"::error::CSV has invalid orientations: {invalid}")
          explicit_orients = csv_orients - {""}
          if len(explicit_orients) > 1:
              print("::notice::Rendering mixed orientations from per-row CSV values")
              csv_orient = "vertical"  # fallback only for rows without a value
          else:
              csv_orient = next(iter(explicit_orients), "vertical")
          env_orient = os.environ.get("SAEM_ORIENTATION", "vertical").lower()
          if csv_orient != env_orient:
              print(f"::warning::CSV={csv_orient} workflow={env_orient} "
                    f"(using CSV value)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"value={csv_orient}\n")
          PY

      - name: Run schema validator
        run: |
          echo "::group::schema_validator.py output"
          if ! python3 schema_validator.py "$BATCH_CSV"; then
            echo "::error file=$BATCH_CSV,title=Schema validation failed::See group above for details"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      - name: Notify success
        run: |
          echo "::notice title=Validation OK::${{ steps.count.outputs.rows }} rows ready to render"

  # ========================================================== render (4-way shard)
  render:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SAEM_ORIENTATION: ${{ needs.validate.outputs.orientation }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          echo "::group::apt-get install"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-science \
            texlive-fonts-recommended dvisvgm \
            libcairo2-dev libpango1.0-dev libsndfile1 \
            build-essential pkg-config
          echo "::endgroup::"

      - name: Cache pip + HF model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ github.workspace }}/.hf_cache
          key: ${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py311-

      - name: Install Python dependencies
        run: |
          echo "::group::pip install"
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          echo "::endgroup::"

      - name: Mask voice sample reference
        run: |
          if [ -f saem_voice_sample.wav ]; then
            echo "::add-mask::saem_voice_sample.wav"
            echo "::notice::Voice reference present"
          else
            echo "::warning title=No voice sample::saem_voice_sample.wav is missing; falling back to manifest durations"
          fi

      - name: Render shard ${{ matrix.shard }} of 4
        id: render
        run: |
          echo "::group::batch_runner.py shard ${{ matrix.shard }}"
          args=(
            python3 batch_runner.py
            --csv "$BATCH_CSV"
            --format "${{ inputs.format || 'both' }}"
            --chunk ${{ matrix.shard }}
            --total-chunks 4
            --retries 2
            --log-file "output_shorts/runlog_shard_${{ matrix.shard }}.json"
          )
          if [ -n "$VIDEO_IDS" ]; then
            args+=(--only "$VIDEO_IDS")
          fi
          if [ -n "$RENDER_QUALITY" ]; then
            args+=(--quality "$RENDER_QUALITY")
          fi
          if "${args[@]}"; then
            rc=0
          else
            rc=$?
          fi
          echo "::endgroup::"
          exit "$rc"

      - name: Count rendered videos
        id: tally
        if: always()
        run: |
          COUNT=$(find output_shorts -maxdepth 1 -name '*_final.mp4' 2>/dev/null | wc -l)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            output_shorts/*.mp4
            output_shorts/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Job summary for shard ${{ matrix.shard }}
        if: always()
        run: |
          SHARD=${{ matrix.shard }}
          COUNT=${{ steps.tally.outputs.count }}
          ORIENT=${{ needs.validate.outputs.orientation }}
          {
            echo "### Shard ${SHARD} — summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Orientation | \`${ORIENT}\` |"
            echo "| Rendered MP4s | ${COUNT} |"
            echo "| Runlog | \`output_shorts/runlog_shard_${SHARD}.json\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ========================================================== merge
  merge_artifacts:
    needs: [validate, render]
    runs-on: ubuntu-latest
    if: always() && needs.validate.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifact directories
        run: mkdir -p merged_output final_output

      - name: Download all shard artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: merged_output

      - name: Flatten artifacts
        run: |
          echo "::group::Flatten"
          find merged_output -type f \( -name "*.mp4" -o -name "*.json" \) \
            -exec cp {} final_output/ \;
          echo "::endgroup::"

      - name: Tally final output
        id: final
        run: |
          MP4S=$(find final_output -name "*.mp4" 2>/dev/null | wc -l)
          SIZE=$(du -sh final_output 2>/dev/null | cut -f1 || echo "0")
          echo "mp4s=${MP4S}" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Final tally::${MP4S} MP4s, ${SIZE} total"

      - name: Upload merged bundle
        uses: actions/upload-artifact@v4
        with:
          name: physics-shorts-bundle
          path: final_output/
          retention-days: 7

      - name: Final job summary
        run: |
          ORIENT=${{ needs.validate.outputs.orientation }}
          ROWS=${{ needs.validate.outputs.row_count }}
          MP4S=${{ steps.final.outputs.mp4s }}
          SIZE=${{ steps.final.outputs.size }}
          {
            echo "## Physics Shorts — Run ${{ github.run_number }}"
            echo ""
            echo "**Source:** Feynman Lectures Vol. II"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Rows queued | ${ROWS} |"
            echo "| Orientation | \`${ORIENT}\` |"
            echo "| MP4s rendered | **${MP4S}** |"
            echo "| Bundle size | ${SIZE} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo ""
            if [ "${MP4S}" -eq 0 ]; then
              echo "> [!WARNING]"
              echo "> No MP4s were produced. Check the shard summaries above."
            else
              echo "> [!NOTE]"
              echo "> Download the \`physics-shorts-bundle\` artifact to retrieve all videos."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
