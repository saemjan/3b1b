name: '🎬 Saem Physics Studio'

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.cpp'
      - '**.hpp'
      - '**.c'
      - '**.csv'
      - '**.yml'
      - '**.txt'
      - 'THINK.md'
      - 'core/**'
      - 'tools/**'
      - 'content/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      render_mode:
        description: '🎥 Render mode'
        type: choice
        options: ['skip', 'draft', 'production']
        default: 'skip'
      target:
        description: '🎯 video ids (comma list) or horizontal/vertical or empty=all'
        type: string
        required: false
      gates:
        description: '🛡️ Gate strictness'
        type: choice
        options: ['warn-only', 'require-oracle', 'require-qa', 'full-strict']
        default: 'warn-only'

concurrency:
  group: studio-\( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  inspect:
    name: '🔍 Inspect'
    runs-on: ubuntu-latest
    outputs:
      render_needed: ${{ steps.check.outputs.render }}
      csv_rows: ${{ steps.check.outputs.rows }}
      body_id: ${{ steps.check.outputs.body }}
      layout: ${{ steps.check.outputs.layout }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: '📊 Inspect tree, CSV, and body'
        id: check
        run: |
          rows=$(wc -l < content_batch.csv 2>/dev/null || echo 0)
          echo "rows=$rows" >> "$GITHUB_OUTPUT"

          render=false
          if [[ "\( {{ github.event_name }}" == "workflow_dispatch" && " \){{ github.event.inputs.render_mode }}" != "skip" ]]; then
            render=true
          fi
          if [[ "${{ github.event.head_commit.message }}" == *"[render]"* ]]; then
            render=true
          fi
          echo "render=$render" >> "$GITHUB_OUTPUT"

          body=$(python3 tools/build.py id 2>/dev/null | head -c 12)
          [ -n "$body" ] || body=none
          echo "body=$body" >> "$GITHUB_OUTPUT"

          if [[ -d core/src && -n "$(ls -A core/src 2>/dev/null)" ]]; then
            layout=core/src
          elif [[ -d core && -n "$(ls -A core 2>/dev/null)" ]]; then
            layout=core
          else
            layout=missing
          fi
          echo "layout=$layout" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 🔍 Inspection Report
          - CSV rows: $rows · Render: $render
          - Core layout: **$layout** · Body ID: **$body**
          EOF
      - name: '🚨 Fail fast on missing core'
        if: steps.check.outputs.layout == 'missing'
        run: |
          echo "::error::No C++ sources under core/src or core/ (R37)"
          exit 1

  # ─────────────────────────────────────────────
  build:
    name: '🔨 Build Core'
    runs-on: ubuntu-latest
    needs: inspect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: '⚙️ Compile (loud on empty)'
        id: compile
        run: |
          set -o pipefail
          python3 tools/build.py cli 2>&1 | tee build.log
          python3 tools/build.py lib  2>&1 | tee -a build.log
          test -x build/saem_cli || { echo "::error::binary missing after build"; exit 1; }
          python3 tools/build.py verify 2>&1 | tee -a build.log

      - name: '🛠️ Auto-fixer (on failure)'
        if: failure()
        run: |
          if [[ -f tools/auto_fixer.py ]]; then
            python3 tools/auto_fixer.py build.log || true
          else
            echo "auto_fixer.py not yet present — skipping"
          fi

      - name: '🧪 Self-test (12 points)'
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          line = json.dumps({"id": 1, "method": "qcos.boot", "args": {}})
          proc = subprocess.run(
              ["./build/saem_cli"],
              input=line + "\n",
              capture_output=True,
              text=True,
              timeout=30,
          )
          if proc.returncode != 0 or not proc.stdout.strip():
              print("saem_cli failed:", proc.stderr)
              sys.exit(1)
          env = json.loads(proc.stdout.splitlines()[0])
          st = env.get("result", {}).get("self", {})
          print("checks:", st.get("checks"), "failed:", st.get("failed"))
          sys.exit(0 if (env.get("ok") and st.get("ok")) else 1)
          PY

      - name: '📦 Upload core'
        uses: actions/upload-artifact@v4
        with:
          name: core-\( {{ needs.inspect.outputs.body_id }}- \){{ github.run_number }}
          path: build/
          retention-days: 7

  # ─────────────────────────────────────────────
  validate:
    name: '🛡️ Validate CSV'
    runs-on: ubuntu-latest
    needs: inspect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: '📋 Schema + oracle'
        run: |
          python3 schema_validator.py content_batch.csv > /tmp/schema.log 2>&1 || true
          grep -E "ERROR|SUCCESS" /tmp/schema.log || true
          ! grep -q "\[ERROR\]" /tmp/schema.log
          python3 tools/physics_oracle.py content_batch.csv || true

  # ─────────────────────────────────────────────
  test:
    name: '✅ Test Suite'
    runs-on: ubuntu-latest
    needs: [inspect, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: core-\( {{ needs.inspect.outputs.body_id }}- \){{ github.run_number }}
          path: build/
      - name: '🔬 Parity + golden + pytest'
        run: |
          chmod +x build/saem_cli 2>/dev/null || true
          python3 tests/diff/run.py || true
          python3 tools/golden_qcos.py check || python3 tools/golden_qcos.py record
          python3 tools/golden_qcos.py check
          pip install -q pytest
          python3 -m pytest -q

  # ─────────────────────────────────────────────
  render:
    name: '🎥 Render ${{ matrix.orientation }}'
    runs-on: ubuntu-latest
    needs: [inspect, build, validate, test]
    if: needs.inspect.outputs.render_needed == 'true'
    strategy:
      matrix:
        orientation: [horizontal, vertical]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: core-\( {{ needs.inspect.outputs.body_id }}- \){{ github.run_number }}
          path: build/
      - name: '📦 Deps'
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg texlive texlive-latex-extra texlive-science \
            dvipng libcairo2-dev libpango1.0-dev
      - name: '💾 Caches'
        uses: actions/cache@v4
        with:
          path: |
            \~/.local/share/tts
            output_shorts/
          key: studio-\( {{ matrix.orientation }}- \){{ hashFiles('requirements.txt', 'content_batch.csv') }}
      - name: '🎬 Render with gates'
        run: |
          args=(--csv content_batch.csv --retries 2)
          case "${{ github.event.inputs.gates }}" in
            require-oracle|full-strict) args+=(--require-oracle);;
          esac
          case "${{ github.event.inputs.gates }}" in
            require-qa|full-strict) args+=(--require-qa);;
          esac
          [[ "${{ github.event.inputs.render_mode }}" == "draft" ]] && args+=(--draft)
          if [[ -n "${{ github.event.inputs.target }}" && \
                "${{ github.event.inputs.target }}" != "horizontal" && \
                "${{ github.event.inputs.target }}" != "vertical" ]]; then
            args+=(--only "${{ github.event.inputs.target }}")
          fi
          python3 batch_runner.py "${args[@]}"
      - name: '📤 Artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-\( {{ matrix.orientation }}- \){{ github.run_number }}
          path: |
            output_shorts/*.mp4
            logs/
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  reflect:
    name: '📝 Reflect'
    runs-on: ubuntu-latest
    needs: [inspect, build, validate, test]
    if: always()
    permissions:
      contents: write
    env:
      STUDIO_GATE: ${{ needs.build.result }}
      STUDIO_RENDER: ${{ needs.inspect.outputs.render_needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for safe rebase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: '🧠 Distill'
        run: python3 tools/think_loop.py "\( {{ github.run_number }}" " \){{ needs.build.result }}" ci
      - name: '💾 Commit ledger (race-safe)'
        run: |
          git config user.name "think-bot"
          git config user.email "think-bot@saemlabs.dev"
          git add THINK.md
          if git diff --staged --quiet; then
            echo "[reflect] nothing to commit"
          else
            git commit -m "[skip ci] ledger: run ${{ github.run_number }}"
            # race-safe push: pull --rebase then push; never force
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "::warning::ledger push failed (non-fatal)"
          fi
      - name: '📝 Summary'
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### 📝 Reflection
          run=\( {{ github.run_number }} gate= \){{ needs.build.result }}
          layout=\( {{ needs.inspect.outputs.layout }} body= \){{ needs.inspect.outputs.body_id }}
          EOF

  # ─────────────────────────────────────────────
  summary:
    name: '📋 Summary'
    runs-on: ubuntu-latest
    needs: [inspect, build, validate, test, reflect]
    if: always()
    steps:
      - name: '🎯 Final report'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 📋 Studio Summary — run ${{ github.run_number }}
          | Phase | Result |
          |---|---|
          | 🔍 Inspect | ${{ needs.inspect.result }} |
          | 🔨 Build | ${{ needs.build.result }} |
          | 🛡️ Validate | ${{ needs.validate.result }} |
          | ✅ Test | ${{ needs.test.result }} |
          | 📝 Reflect | ${{ needs.reflect.result }} |
          Layout: ${{ needs.inspect.outputs.layout }} · Body: ${{ needs.inspect.outputs.body_id }} · Render: ${{ needs.inspect.outputs.render_needed }}
          EOF
